[project]
name = "loregrind"
version = "0.0.0"
description = "Agentic reverse engineering knowledge base for stripped binaries"
requires-python = ">=3.12"
# 런타임 의존성은 계층에 착수할 때만 늘린다. 쓰지 않는 패키지를 락파일에 넣으면
# 첫 uv sync 만 느려지고 공급망 표면은 계속 남는다.
#   mcp — L2 도구 서버(§7 2주차). tools/server.py 만 임포트하며 tools/api.py 는
#         SDK 없이 동작한다 (SDK 버전 변경이 도구 계약을 흔들지 않게)
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
loregrind = "loregrind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loregrind"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
]

[tool.ruff]
src = ["src", "tests", "eval"]
line-length = 100
target-version = "py312"
# scripts/ 는 Ghidra의 Jython/PyGhidra 인터프리터에서 돈다.
# 이 프로젝트의 파이썬 버전·의존성 규칙을 적용하면 거짓 경고만 나온다.
#
# *.md 를 제외하는 이유: ruff 는 마크다운 안의 Python 코드 블록도 포맷한다.
# docs/ 와 .claude/skills/ 의 예시 코드는 "이렇게 쓰라"는 설명이지 실행 코드가 아니고,
# 줄바꿈 위치 자체가 설명의 일부다. 포매터가 이것을 조용히 고쳐 쓰면 문서가 흔들린다.
extend-exclude = ["scripts", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# S608(SQL 문자열 조립)은 db/repo.py 에서 의도적으로 파라미터 바인딩과 함께 쓴다.
# 개별 라인에서 noqa 로 풀고, 전역으로 끄지는 않는다.

[tool.ruff.lint.isort]
# eval/ 은 설치되는 패키지가 아니라 저장소 루트의 하네스라서 ruff 가 서드파티로 본다.
# 명시하지 않으면 `from eval import ...` 가 pytest 옆에 끼어 임포트 그룹이 흔들린다.
known-first-party = ["loregrind", "eval"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest 는 assert 를 쓴다

[tool.mypy]
python_version = "3.12"
# eval/ 도 검사 대상이다. 지표 계산이 틀리면 평가 숫자 전체가 무의미해지는데
# 틀렸다는 신호가 눈에 보이지 않는다 — 타입이 그 신호 중 하나다.
files = ["src", "eval"]
strict = true
warn_unreachable = true
# scripts/ 는 Ghidra 인터프리터 전용이라 타입 검사 대상이 아니다.
exclude = "^scripts/"

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval/ 은 설치되는 패키지가 아니라 저장소 루트의 하네스다 (레이아웃 정본).
# 테스트가 `import eval.metrics` 로 접근할 수 있게 루트를 경로에 넣는다.
pythonpath = ["."]
markers = [
    # Ghidra 없이는 돌 수 없는 테스트. 기본 실행에서 제외하되 스킵 사실은 숨기지 않는다.
    "ghidra: requires a local Ghidra installation ($GHIDRA_HOME)",
]
addopts = "-m 'not ghidra' -ra"
